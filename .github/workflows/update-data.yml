name: Update MG intelligence data

on:
  schedule:
    - cron: "18 1 * * *"
  workflow_dispatch:
    inputs:
      update_scope:
        description: "选择更新范围"
        type: choice
        default: "all"
        options:
          - all
          - literature
          - latest
          - feed
          - china
          - huashan
          - trials

concurrency:
  group: mg-intelligence-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Update source data
        run: npm run update:data -- --scope="${UPDATE_SCOPE}"
        env:
          UPDATE_SCOPE: ${{ github.event.inputs.update_scope || 'all' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SUMMARY_MODEL: gpt-4.1-mini
      - name: Validate generated data
        run: npm run validate:data
      - name: Check text integrity
        run: npm run check:text
      - name: Check bilingual coverage
        run: npm run check:i18n
      - name: Check data health
        run: npm run health:data
      - name: Commit generated data
        run: |
          if git diff --quiet -- data/*.json; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "Update MG intelligence data"
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Sync published branch
        run: |
          git fetch origin master gh-pages
          if git merge-base --is-ancestor origin/master HEAD; then
            git push origin HEAD:gh-pages
          else
            echo "Remote master moved after this run; skip gh-pages sync to avoid publishing stale content."
          fi
