    <script>
      (() => {
        const storageKey = "mgih-language";
        const meta = {
          zh: {
            title: "重症肌无力临床试验与全球市场 | ClinicalTrials.gov、ChiCTR与批准国家",
            description: "追踪重症肌无力全球临床试验、ChiCTR中国试验入口、获批国家/地区、批准机构、适应症和公开市场销售额。",
            ogTitle: "重症肌无力临床试验与全球市场",
            ogDescription: "追踪 MG 全球临床试验、ChiCTR 中国试验入口、获批国家/地区、批准机构、适应症和公开市场销售额。"
          },
          en: {
            title: "MG Clinical Trials and Global Market | ClinicalTrials.gov, ChiCTR and Approvals",
            description: "Track global MG clinical trials, ChiCTR China registry entries, approved countries and regions, agencies, indications and public sales signals.",
            ogTitle: "MG Clinical Trials and Global Market",
            ogDescription: "Track MG clinical trials, ChiCTR China entries, approved countries and regions, agencies, indications and public sales signals."
          }
        };

        function initialLanguage() {
          const params = new URLSearchParams(window.location.search);
          const fromUrl = params.get("lang");
          if (fromUrl === "en" || fromUrl === "zh") return fromUrl;
          try {
            const saved = localStorage.getItem(storageKey);
            if (saved === "en" || saved === "zh") return saved;
          } catch {
            return "zh";
          }
          return "zh";
        }

        function setMeta(selector, value) {
          const element = document.querySelector(selector);
          if (element) element.setAttribute("content", value);
        }

        function syncLinks(language) {
          for (const link of document.querySelectorAll("a[href]")) {
            const raw = link.getAttribute("href");
            if (!raw || raw.startsWith("#") || raw.startsWith("mailto:") || raw.startsWith("tel:")) continue;
            let url;
            try {
              url = new URL(raw, window.location.href);
            } catch {
              continue;
            }
            if (url.origin !== window.location.origin) continue;
            if (language === "en") url.searchParams.set("lang", "en");
            else url.searchParams.delete("lang");
            link.setAttribute("href", url.pathname + url.search + url.hash);
          }
        }

        function applyStaticLanguage(language) {
          const selected = language === "en" ? "en" : "zh";
          document.documentElement.lang = selected === "en" ? "en" : "zh-CN";
          document.body.dataset.trialsLanguage = selected;
          document.title = meta[selected].title;
          setMeta("meta[name='description']", meta[selected].description);
          setMeta("meta[property='og:title']", meta[selected].ogTitle);
          setMeta("meta[property='og:description']", meta[selected].ogDescription);

          for (const element of document.querySelectorAll("[data-trials-zh][data-trials-en]")) {
            element.textContent = element.dataset[selected === "en" ? "trialsEn" : "trialsZh"];
          }
          for (const element of document.querySelectorAll("[data-trials-label-zh][data-trials-label-en]")) {
            element.setAttribute("aria-label", element.dataset[selected === "en" ? "trialsLabelEn" : "trialsLabelZh"]);
          }
          for (const button of document.querySelectorAll("[data-trials-language]")) {
            const active = button.dataset.trialsLanguage === selected;
            button.classList.toggle("is-active", active);
            button.setAttribute("aria-pressed", String(active));
          }
          syncLinks(selected);
        }

        function navigateWithLanguage(language) {
          const selected = language === "en" ? "en" : "zh";
          try {
            localStorage.setItem(storageKey, selected);
          } catch {
            // URL state is enough when storage is unavailable.
          }
          const url = new URL(window.location.href);
          if (selected === "en") url.searchParams.set("lang", "en");
          else url.searchParams.delete("lang");
          const next = url.pathname + url.search + url.hash;
          if (next !== window.location.pathname + window.location.search + window.location.hash) {
            window.location.href = next;
            return;
          }
          applyStaticLanguage(selected);
        }

        document.querySelector(".trials-language-toggle")?.addEventListener("click", (event) => {
          const button = event.target.closest("[data-trials-language]");
          if (button) navigateWithLanguage(button.dataset.trialsLanguage);
        });
        applyStaticLanguage(initialLanguage());
      })();
    </script>
    <script src="../app.js" type="module"></script>
